[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "multihiggs-fitting"
version = "0.1.0"
description = "MadGraph scan and polynomial fitting tools for multi-Higgs cross sections and distributions"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.22",
    "tomli>=2.0; python_version < '3.11'",
]

[project.scripts]
multihiggs = "multihiggs.cli:main"

[tool.setuptools]
packages = ["multihiggs"]
