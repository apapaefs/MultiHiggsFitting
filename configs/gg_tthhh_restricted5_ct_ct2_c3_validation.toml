[process]
name = "gg_tthhh_restricted5_ct_ct2_c3_validation"
mg5_path = "MG5_aMC_v3_5_15"
model = "heft_loop_sm_restricted5"
generate = "g g > t t~ h h h"
output = "gg_tthhh_restricted5_ct_ct2_c3_validation"

[scan]
run_number = "1"
energy_tev = 14.0
nevents = 100
min_events = 100
strategy = "chebyshev_lobatto"
sort = "sm_first"
skip_existing = true
no_cuts = true
extra_set_commands = [
  "set CT3 0.0",
  "set D4 0.0",
]

[scan.madgraph]
accuracy = 0.1
points = 500
iterations = 3

# The restricted5 UFO uses uppercase parameter names. These config names keep
# the scan readable while setting CT1, CT2, and D3 in MadGraph.
[[couplings]]
name = "ct"
parameter = "CT1"
fit_name = "ct"
range = [-1.0, 1.0]
points = 3
fit_offset = 0.0
sm_value = 0.0

[[couplings]]
name = "ct2"
parameter = "CT2"
fit_name = "ct2"
range = [-1.0, 1.0]
points = 3
fit_offset = 0.0
sm_value = 0.0

[[couplings]]
name = "c3"
parameter = "D3"
fit_name = "c3"
range = [-1.0, 1.0]
points = 3
fit_offset = 0.0
sm_value = 0.0

[fit]
basis = "chebyshev"
# This 3x3x3 tensor basis is a validation starter for the example grid.
# For a production fit, generate the process and run `multihiggs infer-terms`.
terms = [
  [0, 0, 0],
  [1, 0, 0],
  [2, 0, 0],
  [0, 1, 0],
  [1, 1, 0],
  [2, 1, 0],
  [0, 2, 0],
  [1, 2, 0],
  [2, 2, 0],
  [0, 0, 1],
  [1, 0, 1],
  [2, 0, 1],
  [0, 1, 1],
  [1, 1, 1],
  [2, 1, 1],
  [0, 2, 1],
  [1, 2, 1],
  [2, 2, 1],
  [0, 0, 2],
  [1, 0, 2],
  [2, 0, 2],
  [0, 1, 2],
  [1, 1, 2],
  [2, 1, 2],
  [0, 2, 2],
  [1, 2, 2],
  [2, 2, 2],
]
normalize_to_sm = true

[[observables]]
name = "h_pt"
kind = "pt"
pdg_id = 25
which = "all"
bins = [0.0, 50.0, 100.0, 150.0, 200.0, 300.0, 500.0, 1000.0]

[[observables]]
name = "hh_mass"
kind = "invariant_mass"
pdg_ids = [25, 25]
which = "all"
bins = [200.0, 300.0, 400.0, 500.0, 700.0, 1000.0, 1500.0, 2500.0]

[[observables]]
name = "hhh_mass"
kind = "invariant_mass"
pdg_ids = [25, 25, 25]
which = "all"
bins = [350.0, 450.0, 600.0, 800.0, 1000.0, 1500.0, 2500.0, 4000.0]

[[observables]]
name = "top_pt"
kind = "pt"
pdg_id = 6
which = "all"
bins = [0.0, 50.0, 100.0, 150.0, 200.0, 300.0, 500.0, 1000.0]
