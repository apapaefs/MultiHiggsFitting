[process]
name = "gg_hhh_restricted5_ct_ct2_ct3_c3_d4_validation"
mg5_path = "MG5_aMC_v3_5_15"
model = "heft_loop_sm_restricted5"
generate = "g g > h h h [noborn=QCD]"
output = "gg_hhh_restricted5_ct_ct2_ct3_c3_d4_validation"

[scan]
run_number = "1"
energy_tev = 14.0
nevents = 100
min_events = 100
strategy = "chebyshev_lobatto"
sort = "sm_first"
skip_existing = true
no_cuts = true

[scan.madgraph]
accuracy = 0.1
points = 500
iterations = 3

# The restricted5 UFO uses uppercase MHEFT parameter names. These config names
# keep the scan readable while setting CT1, CT2, CT3, D3, and D4 in MadGraph.
[[couplings]]
name = "ct"
parameter = "CT1"
fit_name = "ct"
range = [-0.5, 0.5]
points = 3
fit_offset = 0.0
sm_value = 0.0

[[couplings]]
name = "ct2"
parameter = "CT2"
fit_name = "ct2"
range = [-1.0, 1.0]
points = 3
fit_offset = 0.0
sm_value = 0.0

[[couplings]]
name = "ct3"
parameter = "CT3"
fit_name = "ct3"
range = [-1.0, 1.0]
points = 3
fit_offset = 0.0
sm_value = 0.0

[[couplings]]
name = "c3"
parameter = "D3"
fit_name = "c3"
range = [-1.0, 1.0]
points = 3
fit_offset = 0.0
sm_value = 0.0

[[couplings]]
name = "d4"
parameter = "D4"
fit_name = "d4"
range = [-1.0, 1.0]
points = 3
fit_offset = 0.0
sm_value = 0.0

[fit]
basis = "chebyshev"
# Coarse validation interpolation basis. Re-run `multihiggs infer-terms` after
# generating the process if this config is promoted beyond validation use.
