[process]
name = "gg_tthh_restricted5_ct1_ct2_d3_validation"
mg5_path = "MG5_aMC_v3_5_15"
model = "heft_loop_sm_restricted5"
generate = "g g > t t~ h h MHEFT^2<=4"
output = "gg_tthh_restricted5_ct1_ct2_d3_validation"

[scan]
run_number = "1"
energy_tev = 14.0
nevents = 100
min_events = 100
strategy = "chebyshev_lobatto"
sort = "sm_first"
skip_existing = true
no_cuts = true
extra_set_commands = [
  "set CT3 0.0",
  "set D4 0.0",
]

[scan.madgraph]
accuracy = 0.05
points = 1000
iterations = 3

# Three-coupling restricted5 ttHH validation scan in the native MHEFT notation.
# The fit-term order is CT1, CT2, D3, mapped below to KT, CT2, K3.
# Avoid CT1 = -1 in this validation grid: it cancels the SM top Yukawa
# contribution when CT2 = D3 = 0 and MadEvent can fail in that zero-amplitude
# corner during multichannel integration.
[[couplings]]
name = "CT1"
parameter = "CT1"
fit_name = "CT1"
range = [-0.5, 0.5]
points = 5
fit_offset = 0.0
sm_value = 0.0

[[couplings]]
name = "CT2"
parameter = "CT2"
fit_name = "CT2"
range = [-1.0, 1.0]
points = 3
fit_offset = 0.0
sm_value = 0.0

[[couplings]]
name = "D3"
parameter = "D3"
fit_name = "D3"
range = [-1.0, 1.0]
points = 3
fit_offset = 0.0
sm_value = 0.0

[fit]
term_map = "mheft_kappa"
basis = "physical_monomial"
# Compact ttHH physical basis from amplitude structures KT^2, CT2, and KT*K3.
terms = [
  [0, 2, 0],
  [2, 1, 0],
  [1, 1, 1],
  [4, 0, 0],
  [3, 0, 1],
  [2, 0, 2],
]
# Number of basis terms: 6
normalize_to_sm = true

[[observables]]
name = "h_pt"
kind = "pt"
pdg_id = 25
which = "all"
bins = [0.0, 50.0, 100.0, 150.0, 200.0, 300.0, 500.0, 1000.0]

[[observables]]
name = "hh_mass"
kind = "invariant_mass"
pdg_ids = [25, 25]
which = "all"
bins = [200.0, 300.0, 400.0, 500.0, 700.0, 1000.0, 1500.0, 2500.0]

[[observables]]
name = "top_pt"
kind = "pt"
pdg_id = 6
which = "all"
bins = [0.0, 50.0, 100.0, 150.0, 200.0, 300.0, 500.0, 1000.0]
