[process]
name = "gg_hhh"
mg5_path = "MG5_aMC_v3_5_15"
model = "loop_sm_c3d4"
generate = "g g > h h h [noborn=QCD]"
output = "gg_hhh_c3d4"

[scan]
run_number = "2"
energy_tev = 13.6
nevents = 100
strategy = "chebyshev_lobatto"
sort = "sm_first"
skip_existing = true
no_cuts = true

[scan.madgraph]
accuracy = 0.02
points = 3000
iterations = 5

[[couplings]]
name = "c3"
parameter = "c3"
fit_name = "k3"
range = [0.0, 2.0]
points = 7
fit_offset = 1.0
sm_value = 0.0

[[couplings]]
name = "d4"
parameter = "d4"
fit_name = "k4"
range = [-99.0, 101.0]
points = 5
fit_offset = 1.0
sm_value = 0.0

[[extra_points]]
c3 = -0.92388
d4 = 0.0

[[extra_points]]
c3 = -0.707107
d4 = 0.0

[[extra_points]]
c3 = -0.382683
d4 = 0.0

[[extra_points]]
c3 = 0.382683
d4 = 0.0

[[extra_points]]
c3 = 0.707107
d4 = 0.0

[[extra_points]]
c3 = 0.92388
d4 = 0.0

[fit]
term_map = "mheft_kappa"
basis = "physical_monomial"
terms = [
  [0, 0],
  [1, 0],
  [0, 1],
  [2, 0],
  [1, 1],
  [0, 2],
  [3, 0],
  [2, 1],
  [4, 0],
]
normalize_to_sm = true

[[observables]]
name = "h_pt"
kind = "pt"
pdg_id = 25
which = "all"
bins = [0.0, 50.0, 100.0, 150.0, 200.0, 300.0, 500.0, 1000.0]

[[observables]]
name = "hh_mass"
kind = "invariant_mass"
pdg_ids = [25, 25]
which = "all"
bins = [200.0, 300.0, 400.0, 500.0, 700.0, 1000.0, 1500.0, 2500.0]
